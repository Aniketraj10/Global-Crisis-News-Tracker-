<template>
    <!-- Modal Backdrop -->
    <div class="modal-backdrop">
        
        <!-- Modal Box -->
        <div class="modal-box">
            
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">ADD CRISIS REGION</h2>
                <button class="close-btn" onclick={handleCancel}>✕</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                
                <!-- Region Name + LOOKUP button side by side -->
                <div class="form-group">
                    <label class="form-label">Region Name</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" class="form-input" placeholder="e.g. Ukraine" 
                            onchange={handleName}/>
                        <button class="btn-lookup" onclick={handleLookup} disabled={isLoading}>
                            {lookupLabel}
                        </button>
                    </div>
                </div>

                <!-- Latitude - auto filled by LOOKUP -->
                <div class="form-group">
                    <label class="form-label">Latitude</label>
                    <input type="number" class="form-input" placeholder="e.g. 35.8617" 
                        value={latitude} onchange={handleLatitude}/>
                </div>

                <!-- Longitude - auto filled by LOOKUP -->
                <div class="form-group">
                    <label class="form-label">Longitude</label>
                    <input type="number" class="form-input" placeholder="e.g. 104.1954" 
                        value={longitude} onchange={handleLongitude}/>
                </div>

                <!-- Threat Level - auto filled by LOOKUP -->
                <div class="form-group">
                    <label class="form-label">Threat Level</label>
                    <select class="form-input" onchange={handleThreatLevel}>
                        <option value="">-- Select --</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <!-- Search Query - auto filled by LOOKUP -->
                <div class="form-group">
                    <label class="form-label">Search Query</label>
                    <input type="text" class="form-input" 
                        placeholder="e.g. China military Taiwan conflict" 
                        value={searchQuery} onchange={handleSearchQuery}/>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="btn-cancel" onclick={handleCancel}>CANCEL</button>
                <button class="btn-add" onclick={handleAdd}>ADD REGION</button>
            </div>

        </div>
    </div>
</template>
